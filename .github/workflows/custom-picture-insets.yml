name: Custom CarPlay picture insets
on:
  push:
    branches: [codex/carplay-picture-insets]
permissions:
  contents: read
concurrency:
  group: custom-picture-insets-focused
  cancel-in-progress: false
jobs:
  verify-and-build:
    runs-on: ubuntu-22.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;34.0.0 ndk;28.2.13676358 cmake;3.22.1'
      - uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: false
      - name: Download upstream native dependencies
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for ABI in arm64-v8a x86_64; do
            gh release download native-deps --repo mossyhub/openautolink -p "native-deps-${ABI}.tar.gz" -O "$RUNNER_TEMP/native-deps-${ABI}.tar.gz"
            tar xzf "$RUNNER_TEMP/native-deps-${ABI}.tar.gz" -C app/src/main/cpp/
          done
      # A separate full-suite run is retained as evidence. Upstream CI already
      # fails in unrelated host Conscrypt/cluster tests. Gate this scoped build
      # on the changed display/settings/layout behavior and its existing tests.
      - name: Verify main-picture settings, layout, touch and existing display contracts
        run: |
          bash ./gradlew :app:testTabletDebugUnitTest \
            --tests 'com.openautolink.app.data.CarPlay*' \
            --tests 'com.openautolink.app.carplay.CarPlayPictureLayoutTest' \
            --tests 'com.openautolink.app.carplay.CarPlayBackground*' \
            --tests 'com.openautolink.app.carplay.CarPlaySurfaceReceiptTest' \
            --tests 'com.openautolink.app.carplay.CarPlayTouchMapperTest' \
            --tests 'com.openautolink.app.carplay.CarPlayAutoScaleWiringTest' \
            --tests 'com.openautolink.app.carplay.CarPlayDisplayOffer*' \
            --tests 'com.openautolink.app.carplay.CarPlayOverlay*' \
            --tests 'com.openautolink.app.ui.projection.CarPlayCalibrationGeometryTest' \
            --tests 'com.openautolink.app.ui.projection.UsbSettingsSaveTransactionTest' \
            --tests 'com.openautolink.app.ui.settings.CarPlay*Calibration*' \
            --tests 'com.openautolink.app.ui.settings.CarPlaySafeEditorHostTest' \
            --tests 'com.openautolink.app.ui.settings.CarPlaySettings*' \
            --tests 'com.openautolink.app.ui.settings.SettingsSaveSourceContractTest' \
            --tests 'com.openautolink.app.ui.settings.CarPlayAtomicCommitTest' \
            --tests 'com.openautolink.app.ui.settings.CarPlayDock*' \
            --tests 'com.openautolink.app.ui.settings.CarPlayCustomVideoSettingsTest' \
            --no-daemon --init-script .github/workflows/ci-test-memory.gradle --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx1536m -XX:ActiveProcessorCount=2'
          bash ./gradlew :carplay-lab:testDebugUnitTest \
            --tests 'com.openautolink.carplaylab.media.*' \
            --tests 'com.shilapi.xcertplay.media.CarPlayVideoQualificationTest' \
            --no-daemon --init-script .github/workflows/ci-test-memory.gradle --max-workers=1 \
            -Pkotlin.compiler.execution.strategy=in-process \
            '-Dorg.gradle.jvmargs=-Xmx1536m -XX:ActiveProcessorCount=2'
      - name: Build unsigned credential-free custom template
        run: >-
          bash ./gradlew :app:bundleRelease --no-daemon --max-workers=2
          -Dorg.gradle.jvmargs=-Xmx3g
          -PappId=com.openautolink.template -PoalBuilderUnsigned=true
          -PoalVersionCode=577 -PoalVersionName=0.1.575-background1
      - name: Record template digest
        run: |
          cd app/build/outputs/bundle/release
          sha256sum app-release.aab > app-release.aab.sha256
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: custom-picture-insets-results
          path: |
            app/build/test-results/
            carplay-lab/build/test-results/
            app/build/reports/tests/
            carplay-lab/build/reports/tests/
            app/build/outputs/bundle/release/*.aab*
          if-no-files-found: warn
          retention-days: 14
